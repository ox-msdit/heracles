services:
  build:
    build: .
    image: heracles-build

  export:
    image: heracles-build
    depends_on:
      - build
    volumes:
      - ./Heracles.Console/Binaries/Linux-x64:/output
    command:
      - sh
      - -c
      - cp /publish/heracles /output/heracles

  test-1804:
    image: ubuntu:18.04
    volumes:
      - ./Heracles.Console/Binaries/Linux-x64:/app:ro
    env_file:
      - env
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apt-get update &&
        apt-get install -y --no-install-recommends ca-certificates &&
        /app/heracles search heracles

